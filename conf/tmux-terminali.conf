# Titoli dei terminali, per la dashboard.
#
# Quando un'applicazione scrive il titolo -- la sequenza OSC 2, quella che su
# un xterm cambia il titolo della finestra -- al browser non arriva niente:
# tmux la intercetta e se la tiene come pane_title (si vede anche in basso a
# destra, la status-right di serie lo mostra). Con set-titles on tmux lo
# rimanda fuori, al terminale del client, che qui e' l'xterm.js dentro ttyd:
# lui lo mette nel document.title del proprio documento, e la dashboard --
# stessa origine -- lo legge da li'. [RR]
set -g set-titles on

# Escono TUTTI E DUE i nomi, e la scelta la fa la pagina: cosi' si passa dal
# titolo dell'applicazione al comando in esecuzione da un bottone, senza
# toccare tmux e senza riavviare niente.
#
#   DH<US><titolo dell'applicazione><US><comando in esecuzione><US>
#
# <US> e' U+241F (␟), il carattere "unit separator": in un titolo vero non
# c'e'. Serve anche in coda perche' ttyd, prima di scrivere il document.title,
# appende " | " e il titolo suo: senza il terzo separatore quella coda
# finirebbe dentro il secondo campo.
#
# Il primo campo esce VUOTO finche' pane_title vale l'hostname, che e' quanto
# tmux ci mette prima che un'applicazione lo cambi. Senza questo controllo
# ogni tab si chiamerebbe come la macchina e -- visto che l'automatico ha la
# precedenza -- i nomi scritti a mano non si vedrebbero piu' da nessuna parte.
#
# Il secondo campo e' window_name, che con automatic-rename (acceso di serie)
# e' il comando in esecuzione nel pane attivo.
set -g set-titles-string 'DH␟#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},,#{pane_title}}␟#{window_name}␟'

# Mostra/nasconde la status-bar dalla dashboard (il bottone "Barra tmux").
# Due bind ESPLICITI (Ctrl-B Maiusc-S / Maiusc-T) e non un solo tasto che fa
# toggle guardando #{status}: cosi' il comando che arriva dalla pagina
# impone sempre lo stato che il bottone dice, anche se e' gia' quello, invece
# di ribaltarlo alla cieca se qualcuno l'ha gia' cambiato a mano nel
# frattempo. Maiuscole perche' le minuscole sono gia' tutte occupate dai
# bind di serie (s = choose-tree, t = clock-mode). E' -g, quindi vale per
# TUTTI i terminali: girano su un solo server tmux condiviso (vedi KillMode
# in ttyd@.service.tmpl), non su uno a testa. [RR]
bind-key S set -g status off
bind-key T set -g status on
