# Impostazioni dell'ambiente "terminali web". Lo leggono install.sh, verifica.sh
# e gli script in certs/. Ogni valore si puo' sovrascrivere dall'ambiente:
#   DOMINIO=term.esempio.it ./install.sh
# [RR]

# --- override locali di QUESTO server -----------------------------------------
# impostazioni.locale.conf, se c'e', viene letto PRIMA dei default qui sotto:
# serve ad adottare un'installazione preesistente con path e nomi diversi
# (vedi "Adottare un'installazione esistente" nel README). Non e' tracciato da
# git, quindi resta su questo server. Va scritto con la stessa forma dei
# default, cosi' l'ambiente continua a vincere su tutto:
#   : "${DOMINIO:=term.esempio.it}"
# Letto prima e non dopo perche' i valori derivati (SSL_CRT dal DOMINIO, ...)
# devono calcolarsi sul valore vero, non su quello di default. [RR]
_LOCALE="$(dirname "${BASH_SOURCE[0]}")/impostazioni.locale.conf"
if [ -r "$_LOCALE" ]; then
    # shellcheck source=/dev/null
    . "$_LOCALE"
fi
unset _LOCALE

# --- chi e dove ---------------------------------------------------------------
# Nome con cui il vhost risponde. Deve stare nel certificato TLS del server.
# ATTENZIONE al default: `hostname -f` e' il nome interno della macchina, che
# non e' detto sia quello con cui la si raggiunge da fuori ne' quello che sta
# nel certificato. Se i due non coincidono, va messo a mano.
: "${DOMINIO:=$(hostname -f)}"

# Utente di sistema sotto cui girano le shell dei terminali. NON root: le
# sessioni tmux sono raggiungibili dal browser, e un errore di configurazione
# dell'mTLS diventerebbe una root shell aperta.
: "${UTENTE:=$(logname 2>/dev/null || echo "${SUDO_USER:-root}")}"
: "${GRUPPO:=$UTENTE}"

# --- quanti terminali ---------------------------------------------------------
# N_TERM istanze ttyd su porte consecutive da PORTA_BASE, esposte come
# /term0/ ... /term<N-1>/ e attaccate alle sessioni tmux term-<porta>.
: "${N_TERM:=10}"
: "${PORTA_BASE:=8700}"

# --- web ----------------------------------------------------------------------
# PREFISSO vuoto: un server{} tutto nostro sulla 443, per il solo $DOMINIO.
# PREFISSO=/term: niente server{} nuovo, il servizio si monta sotto
# https://$DOMINIO/term/ dentro il server{} che quel sito ha gia'. TLS e mTLS
# sono i suoi: il suo certificato e la sua ssl_client_certificate, che quindi
# deve essere CA_CRT (install.sh lo controlla). Una sola parte di percorso o
# piu' (/strumenti/term), senza barra finale.
: "${PREFISSO:=}"
# Dove install.sh scrive le location del modo PREFISSO: il server{} del sito
# le prende con una riga `include`, che install.sh aggiunge chiedendo.
: "${INCLUDE_PATH:=/etc/nginx/terminali-path.inc}"

# Col PREFISSO la dashboard NON va nella root del sito: la' c'e' gia' un
# index.html che e' del sito, e si finirebbe per sovrascriverlo.
[ -n "$PREFISSO" ] && : "${WEBROOT:=/usr/share/nginx/terminali}"
: "${WEBROOT:=/usr/share/nginx/html}"
: "${VHOST:=/etc/nginx/conf.d/terminali.conf}"
: "${TITOLO:=Terminal Dashboard}"

# --- profili per utente -------------------------------------------------------
# I nomi e l'ordine dei tab stanno in localStorage, cioe' valgono per QUEL
# browser. Con i profili accesi la dashboard li tiene anche sul server, in un
# JSON per identita', e li ritrova cambiando browser.
#
# Non serve nessun backend: nginx di Rocky ha ngx_http_dav_module compilato,
# quindi accetta il PUT da se'. L'identita' e' il CN del certificato client --
# l'unica cosa che il servizio sa di chi entra. Due browser che importano lo
# stesso .p12 condividono i nomi; due dispositivi con certificati diversi
# restano profili separati, che e' anche la separazione che serve per poter
# revocare un dispositivo solo.
#
# 'no' non genera i blocchi nel vhost: la dashboard non trova /io e resta al
# comportamento di prima, senza errori.
: "${PROFILI:=si}"

# Fuori dal WEBROOT, e non per pignoleria: il webroot lo serve anche il default
# server sulla 80, in chiaro (vedi PROTEGGI_80). Qui dentro ci sono preferenze
# di persone identificate, e non devono uscire da https+mTLS.
#
# L'ultimo pezzo del percorso deve essere 'profili': e' anche il path nell'URL
# (/profili/<cn>.json), che la dashboard ha scritto dentro. Cambiare la
# directory si puo', cambiare quel nome no, e install.sh lo controlla.
: "${DIR_PROFILI:=/var/lib/terminali/profili}"

# --- porta 80 -----------------------------------------------------------------
# Il WEBROOT non e' roba nostra in esclusiva: la configurazione di serie di
# nginx ha un `server { listen 80; root /usr/share/nginx/html; }` che serve la
# STESSA directory in chiaro e senza mTLS. Chi ci lascia un .p12 lo pubblica.
#
# 'nome'    (default) si installa un server sulla 80 per il solo $DOMINIO, che
#           risponde 301 verso https. Non tocca il default server, quindi non
#           disturba altri siti sulla stessa macchina. NON copre l'accesso per
#           indirizzo IP nudo, che continua a finire sul default server.
# 'default' si prende il default server della 80 (`listen 80 default_server`)
#           e chiude con 444 tutto quello che non ha un vhost suo. Copre anche
#           l'IP nudo: e' la scelta giusta su una macchina dedicata, ma su una
#           condivisa cambia il comportamento degli altri siti senza nome.
# 'no'      non si tocca la 80.
#
# In nessuno dei tre casi questo e' *la* protezione: quella e' non tenere
# chiavi nel WEBROOT, e install.sh si rifiuta di procedere se ne trova.
: "${PROTEGGI_80:=nome}"
: "${VHOST_80:=/etc/nginx/conf.d/terminali-80.conf}"

# --- TLS del server (quello che il browser verifica) --------------------------
# Se il certificato non esiste, install.sh ne genera uno autofirmato con
# certs/cert-server.sh. Con un certificato vero (Let's Encrypt, CA aziendale)
# basta puntare qui i due file.
: "${SSL_CRT:=/etc/nginx/ssl/$DOMINIO.crt}"
: "${SSL_KEY:=/etc/nginx/ssl/$DOMINIO.key}"

# --- Modalita' di verifica del certificato client -----------------------------
# 'on'       nginx PRETENDE il certificato: chiude a livello TLS con
#            "400 No required SSL certificate was sent". E' il default: la
#            richiesta non arriva mai a toccare la configurazione del sito.
# 'optional' nginx accetta la connessione anche senza certificato, e a
#            bloccarla e' il controllo su $ssl_client_verify nel vhost, che
#            risponde spiegando cosa manca (assente / scaduto / CA sbagliata).
#            Piu' comodo da diagnosticare, ma la protezione diventa quel
#            controllo: se qualcuno lo cancella, resta tutto aperto.
# Il controllo nel vhost c'e' in entrambi i casi: con 'on' non scatta mai, e
# serve da rete di sicurezza se un domani si passa a 'optional'.
: "${VERIFICA_CLIENT:=on}"

# --- CA dei certificati client (mTLS: chi puo' entrare) -----------------------
# E' l'unica autenticazione del servizio. Chi ha un certificato firmato da
# questa CA ha una shell; chi non l'ha non passa.
: "${CA_CRT:=/etc/ssl/certs/terminali-ca.crt}"
: "${CA_KEY:=/etc/ssl/private/terminali-ca.key}"
: "${CA_SRL:=/etc/ssl/private/terminali-ca.srl}"
: "${CA_SUBJ:=/C=IT/ST=ITALY/L=MILANO/O=DIGITHERA/OU=TERMINALI-CA/CN=TERMINALI-CA}"
: "${CA_GIORNI:=3650}"

# Dove finiscono i certificati client emessi (.p12 per browser e telefoni,
# .crt/.key in PEM per curl e per i client Linux). Fuori dal webroot: un .p12
# scaricabile dal web vanificherebbe l'mTLS.
: "${CERT_CLIENT_DIR:=/root/certs-client}"
: "${CLIENT_GIORNI:=730}"

# Nome del primo certificato client, emesso da install.sh se non esiste.
: "${CLIENT_INIZIALE:=primo-accesso}"
